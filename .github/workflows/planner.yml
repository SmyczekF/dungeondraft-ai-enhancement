name: Validate planner
permissions:
  contents: read
on:
  push:
    paths: ["server/**", "schemas/**", "examples/forest-ambush.json", ".github/workflows/planner.yml"]
  pull_request:
    paths: ["server/**", "schemas/**", "examples/forest-ambush.json", ".github/workflows/planner.yml"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./server
      - run: python -m unittest discover -s server/tests -v
